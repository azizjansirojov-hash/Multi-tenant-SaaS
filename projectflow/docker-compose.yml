# LOCAL DEV ONLY — credentials are for local Docker services, never reuse in production.
services:
  postgres:
    image: postgres:16
    container_name: syzx-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      # LOCAL DEV ONLY
      POSTGRES_USER: syzx_dev
      # LOCAL DEV ONLY
      POSTGRES_PASSWORD: syzx_dev_password
      # LOCAL DEV ONLY
      POSTGRES_DB: syzx_dev
    volumes:
      - syzx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syzx_dev -d syzx_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LOCAL DEV ONLY — S3-compatible object storage for attachments
  minio:
    image: minio/minio:latest
    container_name: syzx-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # LOCAL DEV ONLY
      MINIO_ROOT_USER: syzx_minio
      # LOCAL DEV ONLY
      MINIO_ROOT_PASSWORD: syzx_minio_password
    volumes:
      - syzx_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  syzx_pgdata:
  syzx_minio:
